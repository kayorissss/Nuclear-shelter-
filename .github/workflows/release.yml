name: Build and Attach Release Assets

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Native Win64 EXE and ZIP to GitHub Release v1.0.0 Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --title "☢ БУНКЕР «ЗАСЛОН-19»: ПЕПЕЛ УРАЛА — v1.0.0 (Windows .EXE + 3D/2D Release)" --notes "Релиз игры"
          fi
          gh release upload v1.0.0 \
            release/Zaslon19_Bunker.exe \
            release/Zaslon19_Nuclear_Shelter_Win64_v1.0.0.zip \
            release/Zaslon19_Standalone.html \
            assets/icon.ico \
            --clobber

      - name: Build Full Standalone Win64 Electron Bundle (~105 MB) and Upload to Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes @electron/packager . Zaslon19_Bunker_Full --platform=win32 --arch=x64 --out=dist_electron --overwrite --ignore="^/(release|native_win|dist_electron)"
          cp release/Zaslon19_Bunker.exe dist_electron/Zaslon19_Bunker_Full-win32-x64/Zaslon19_Launcher.exe
          cp assets/icon.ico dist_electron/Zaslon19_Bunker_Full-win32-x64/icon.ico
          cd dist_electron && zip -r -6 ../Zaslon19_Full_Engine_Win64_v1.0.0.zip Zaslon19_Bunker_Full-win32-x64
          cd ..
          gh release upload v1.0.0 Zaslon19_Full_Engine_Win64_v1.0.0.zip --clobber
